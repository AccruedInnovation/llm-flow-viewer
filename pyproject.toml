[project]
name = "llm-flow-viewer"
version = "0.1.0"
description = "TUI application for browsing and analyzing LLM API call flows captured via mitmproxy"
requires-python = ">=3.12"
dependencies = [
    "mitmproxy>=12.2.3",
    "pyarrow>=24.0.0",
    "python-ulid>=3.1.0",
    "textual>=1.0.0",
]

[project.scripts]
llm-flow-viewer = "llm_flow_viewer.tui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
